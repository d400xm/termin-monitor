name: Sprawdzaj terminy ZnanyLekarz

on:
  schedule:
    - cron: "*/5 * * * *" # co 5 minut (GitHub potrafi opozniac do kilkunastu minut)
  workflow_dispatch: # mozliwosc recznego uruchomienia z zakladki Actions

permissions:
  contents: write

concurrency:
  group: sprawdzanie-terminow
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      # zadanie startuje co 5 minut, a w srodku sprawdza co ~minute,
      # bo harmonogram GitHuba nie schodzi ponizej 5 minut
      - name: Sprawdzaj termin co minute przez ~4,5 min
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          end=$((SECONDS + 280))
          while [ $SECONDS -lt $end ]; do
            python3 check_termin.py
            sleep 60
          done

      - name: Zapisz stan do repozytorium
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Aktualizacja stanu terminow"
            git pull --rebase
            git push
          fi
