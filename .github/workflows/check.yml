name: Sprawdzaj terminy ZnanyLekarz

on:
  schedule:
    - cron: "*/5 * * * *" # co 5 minut (GitHub potrafi opozniac do kilkunastu minut)
  workflow_dispatch: # mozliwosc recznego uruchomienia z zakladki Actions

permissions:
  contents: write

concurrency:
  group: sprawdzanie-terminow
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Sprawdz najblizszy termin
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 check_termin.py

      - name: Zapisz stan do repozytorium
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Aktualizacja stanu terminow"
            git pull --rebase
            git push
          fi
